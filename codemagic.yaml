definitions:
  ridge_env: &ridge_env
    groups:
      - code-signing
    flutter: 3.44.8
    xcode: latest
    cocoapods: default
    vars:
      RUNNER_BUNDLE_ID: com.pyrofall.ridgegame
      PUSH_EXTENSION_BUNDLE_ID: com.pyrofall.ridgegame.NotificationService
      APP_STORE_APPLE_ID: "6792835699"

workflows:
  ridge-appstore:
    name: Pyrofall Ridge — App Store build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Pyrofall Ridge Codemagic

    environment: *ridge_env

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: gray-part-ios
          include: true

    scripts:
      - name: Resolve Dart and pod dependencies
        script: |
          flutter pub get
          pod install --project-directory=ios

      - name: Provision the app and the push extension
        script: |
          keychain initialize
          for identifier in "$RUNNER_BUNDLE_ID" "$PUSH_EXTENSION_BUNDLE_ID"; do
            app-store-connect fetch-signing-files "$identifier" \
              --type IOS_APP_STORE \
              --platform IOS \
              --create
          done
          keychain add-certificates

      - name: Archive the IPA
        script: |
          # Build unsigned first: this step can rewrite the Xcode project, so
          # profiles have to be applied afterwards or they get dropped.
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
